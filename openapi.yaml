openapi: 3.0.4
info:
  title: Company Name Generator
  description: >-
    Company Name Generator generates business name ideas from a seed keyword,
    returning a list of suggested brand names. Supply any industry or concept
    word to receive ready-made brand naming suggestions.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/companynamegenerator:
    get:
      summary: Company Name Generator
      description: Generate company names based on the specified criteria
      operationId: companynamegenerator
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          required: true
          description: The keyword to generate company names from
          example: systems
        - name: count
          in: query
          schema:
            type: integer
          required: false
          description: The number of company names to generate
          example: 5
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  keyword: systems
                  count: '5'
                  names:
                    - SystemsVibe
                    - SystemsGrid
                    - SystemsDeck
                    - TrueSystems
                    - SystemsCape
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
